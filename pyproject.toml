[project]
name = "cvorch"
version = "0.1.0"
description = "LLM-driven orchestration of CV data-preparation and training workflows: direct tool calling vs. structured plan + validation"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.40",
    "pydantic>=2.6",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
cvorch = "cvorch.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cvorch"]

[tool.pytest.ini_options]
testpaths = ["tests"]
